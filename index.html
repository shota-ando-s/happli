<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happli のダウンロード</title>
<style>
  :root { --bg:#f6f8fb; --surface:#fff; --text:#1d273b; --muted:#667085; --primary:#206bc4; --border:#e6e7e9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151f2c; --surface:#1b2434; --text:#e6e9ef; --muted:#9aa4b2; --primary:#4c8fdb; --border:#2c3748; } }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; line-height:1.7; }
  main { max-width:40rem; margin:3rem auto; padding:0 16px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.5rem; }
  h1 { font-size:1.5rem; margin:0 0 .25rem; }
  .muted { color:var(--muted); }
  .btn { display:inline-block; margin:1rem 0; padding:.625rem 1.25rem; border-radius:8px; background:var(--primary); color:#fff; font-weight:700; text-decoration:none; }
  ol { padding-left:1.25rem; }
  a { color:var(--primary); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Happli（はぷり）</h1>
    <p class="muted">Excelマクロの作業をブラウザだけで行えるツール集です。最新版：<strong id="ver">—</strong></p>
    <a class="btn" href="https://github.com/shota-ando-s/happli/releases/latest/download/happli.zip">最新版をダウンロード（zip）</a>
    <ol>
      <li>ダウンロードした zip を展開します。</li>
      <li>今お使いのフォルダを、展開した <code>happli</code> フォルダに置き換えます。お気に入りなどの設定はブラウザに残っているので、そのまま使えます。</li>
      <li><code>index.html</code> をダブルクリックして開きます（Chrome / Edge）。</li>
    </ol>
    <p class="muted"><a id="notes" href="https://github.com/shota-ando-s/happli/releases">変更点の一覧</a></p>
  </div>
</main>
<script>
fetch('version.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (m) {
  document.getElementById('ver').textContent = m.latest + '（' + m.released + '）';
  if (m.notes) document.getElementById('notes').href = m.notes;
}).catch(function () {});
</script>
</body>
</html>
